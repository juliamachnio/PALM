EXP_NAME: 'busi_simclr'
RNG_SEED: 1
SETUP: mocov3

DATASET:
  NAME: BUSI
  ROOT_DIR: './data/BUSI'  # point at your local copy
  VAL_RATIO: 0.1
  AUG_METHOD: 'hflip'

MODEL:
  TYPE: resnet18
  NUM_CLASSES: 3

OPTIM:
  TYPE: 'sgd'
  BASE_LR: 0.025
  LR_POLICY: cos
  LR_MULT: 0.1
  MAX_EPOCH: 100
  MOMENTUM: 0.9
  NESTEROV: True
  WEIGHT_DECAY: 0.0003
  GAMMA: 0.1

TRAIN:
  SPLIT: train
  BATCH_SIZE: 64
  IM_SIZE: 224
  EVAL_PERIOD: 2

TEST:
  SPLIT: test
  BATCH_SIZE: 64
  IM_SIZE: 224

DATA_LOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: True

CUDNN:
  BENCHMARK: True

ACTIVE_LEARNING:
  INIT_L_RATIO: 0.
  BUDGET_SIZE: 10  # paper's Δb for BUSI; always overridden by train_al.py's --budget flag
  MAX_ITER: 2000
  FINE_TUNE: False
  DELTA_RESOLUTION: 0.05
  MAX_DELTA: 1.1
