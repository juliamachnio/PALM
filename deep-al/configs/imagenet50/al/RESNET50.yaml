EXP_NAME: 'imN_50_simclr'
RNG_SEED: 1
SETUP: moco
DATASET:
  NAME: IMAGENET50
  ROOT_DIR: '/home/ju-ma/PycharmProjects/rankk/scan/datasets/imagenet'
  VAL_RATIO: 0.1
  AUG_METHOD: 'hflip'
MODEL:
  TYPE: resnet50
  NUM_CLASSES: 50
OPTIM:
  TYPE: 'sgd'
  BASE_LR: 0.025
  LR_POLICY: cos
  LR_MULT: 0.1
  # STEPS: [0, 60, 120, 160, 200] 
  MAX_EPOCH: 200
  MOMENTUM: 0.9
  NESTEROV: True
  WEIGHT_DECAY: 0.0003
  GAMMA: 0.1
TRAIN:
  SPLIT: train
  BATCH_SIZE: 512
  IM_SIZE: 224
  EVAL_PERIOD: 2
TEST:
  SPLIT: val
  BATCH_SIZE: 512
  IM_SIZE: 224
DATA_LOADER:
  NUM_WORKERS: 4
CUDNN:
  BENCHMARK: True
ACTIVE_LEARNING:
  INIT_L_RATIO: 0.
  BUDGET_SIZE: 100
#  SAMPLING_FN: 'uncertainty'
  MAX_ITER: 20
  FINE_TUNE: False
  DELTA_RESOLUTION: 0.05
  MAX_DELTA: 1.1